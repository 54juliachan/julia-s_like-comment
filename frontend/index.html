<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Julia 的 Like & Comment Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>🌸 Julia 的貼文</h2>
  <p>今天開始學 FastAPI，好神奇～</p>
  <p>❤️ 讚數：<span id="likeCount">0</span></p>

  <div class="comment-list" id="commentList"></div>

  <script src="script.js"></script>
</body>
</html>
